<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>Paanz Formatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
</script>
<style>
:root{
  color-scheme: dark;
  --bg:#04050a;
  --surface:rgba(16,19,28,.72);
  --ink:#eef1f8;
  --ink-soft:#c4cad9;
  --mute:#7a8294;
  --line:rgba(180,195,230,.10);
  --line-soft:rgba(180,195,230,.18);
  --acc:#e8ecff;
  --acc-ink:#04050a;
  --err:#ff8a80;
  --ok:#8ee6bb;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.65 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  letter-spacing:.005em;min-height:100vh;
}

/* ---------- galaxy canvas ---------- */
#galaxy{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.glow-layer{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 22% 18%, rgba(120,140,220,.16), transparent 60%),
    radial-gradient(ellipse 55% 45% at 82% 32%, rgba(200,215,255,.10), transparent 62%),
    radial-gradient(ellipse 70% 50% at 50% 90%, rgba(140,120,200,.14), transparent 65%),
    radial-gradient(ellipse 45% 35% at 10% 75%, rgba(180,200,255,.08), transparent 60%);
  animation:nebulaDrift 60s var(--ease) infinite alternate;
  will-change:transform,opacity;
}
@keyframes nebulaDrift{
  0%{transform:translate3d(0,0,0) scale(1);opacity:.9}
  50%{transform:translate3d(-1.2%,.8%,0) scale(1.04);opacity:1}
  100%{transform:translate3d(1%,-1%,0) scale(1);opacity:.9}
}

/* ============================================================
   LAYAR LOGIN
   ============================================================ */
.login-screen{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  transition:opacity .45s var(--ease),visibility .45s;
}
.login-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}

.login-card{
  position:relative;
  width:100%;max-width:380px;
  padding:36px 32px 32px;
  background:linear-gradient(180deg,rgba(18,22,32,.92),rgba(10,12,18,.92));
  border:1px solid var(--line-soft);
  border-radius:22px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 40px 100px -30px rgba(0,0,0,.9),
    0 0 0 1px rgba(180,195,230,.05),
    inset 0 1px 0 rgba(220,230,255,.06);
  animation:cardIn .7s var(--ease-out) both;
  transform-origin:center center;
  transition:transform .35s var(--ease),opacity .35s var(--ease),filter .35s var(--ease);
  will-change:transform,opacity;
}
@keyframes cardIn{
  from{opacity:0;transform:translate3d(0,20px,0) scale(.96);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.login-card.shake{
  animation:shake .45s cubic-bezier(.36,.07,.19,.97);
}
@keyframes shake{
  10%,90%{transform:translate3d(-2px,0,0)}
  20%,80%{transform:translate3d(4px,0,0)}
  30%,50%,70%{transform:translate3d(-6px,0,0)}
  40%,60%{transform:translate3d(6px,0,0)}
}
.login-card.card-out{
  opacity:0;transform:scale(.9) translate3d(0,10px,0);filter:blur(6px);
}

.login-brand{
  font-family:"Space Grotesk",sans-serif;
  font-size:.72rem;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--mute);
  text-align:center;
  margin-bottom:22px;
}
.login-title{
  font-family:"Chewy",cursive;
  font-size:1.6rem;font-weight:400;
  letter-spacing:.01em;text-align:center;
  margin:0 0 8px;
  background:linear-gradient(180deg,#ffffff,#b8c1d9);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(200,215,255,.35));
}
.login-hint{
  text-align:center;font-size:.84rem;color:var(--mute);
  margin:0 0 24px;letter-spacing:.01em;
}

.pw-field{
  position:relative;
  margin-bottom:14px;
}
.pw-field input{
  width:100%;
  padding:14px 48px 14px 16px;
  font:inherit;font-size:.95rem;
  color:var(--ink);
  background:rgba(8,10,16,.7);
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
  letter-spacing:.02em;
}
.pw-field input:focus{
  border-color:rgba(200,215,255,.5);
  background:rgba(12,15,22,.85);
  box-shadow:0 0 0 3px rgba(200,215,255,.10);
}
.pw-field input::placeholder{color:rgba(120,130,150,.6);letter-spacing:.02em}
.pw-field input::-ms-reveal,
.pw-field input::-ms-clear{display:none}

.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;
  border-radius:9px;border:0;background:transparent;
  color:var(--mute);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s var(--ease),background .2s var(--ease);
}
.pw-toggle:hover{color:var(--ink-soft);background:rgba(200,215,255,.06)}
.pw-toggle svg{width:18px;height:18px;display:block}
.pw-toggle .eye-off{display:none}
.pw-toggle.showing .eye-on{display:none}
.pw-toggle.showing .eye-off{display:block}

.login-btn{
  width:100%;
  padding:14px 20px;min-height:48px;
  font:inherit;font-weight:600;font-size:.95rem;letter-spacing:.02em;
  border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#f2f4fb,#d5dbeb);
  color:var(--acc-ink);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s ease;
  position:relative;
  overflow:hidden;
}
.login-btn:hover:not(:disabled){transform:translate3d(0,-1px,0);box-shadow:0 14px 30px -12px rgba(200,215,255,.6)}
.login-btn:active:not(:disabled){transform:scale(.98)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}

.login-msg{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:.8rem;
  letter-spacing:.01em;
  color:var(--err);
  opacity:0;
  transition:opacity .2s var(--ease);
}
.login-msg.show{opacity:1}

/* Flash effect */
.flash-overlay{
  position:fixed;inset:0;z-index:55;
  pointer-events:none;
  background:radial-gradient(circle at 50% 100%, rgba(200,215,255,.35), transparent 60%);
  opacity:0;
}
.flash-overlay.fire{animation:flashFire .5s ease-out}
@keyframes flashFire{
  0%{opacity:0}
  25%{opacity:1}
  100%{opacity:0}
}

/* ============================================================
   ROKET
   ============================================================ */
.rocket-layer{
  position:fixed;inset:0;z-index:60;
  pointer-events:none;
  overflow:hidden;
}
.rocket{
  position:absolute;
  left:50%;bottom:-220px;
  width:80px;height:140px;
  transform:translateX(-50%);
  will-change:transform,bottom,opacity;
  opacity:0;
}
.rocket.launch{
  animation:rocketLaunch 1.15s cubic-bezier(.42,0,.58,1) forwards;
}
@keyframes rocketLaunch{
  0%{bottom:-220px;opacity:0}
  8%{opacity:1}
  50%{bottom:35vh;opacity:1}
  90%{opacity:.6}
  100%{bottom:115vh;opacity:0}
}
.rocket .flame{
  transform-origin:50% 0%;
  animation:flamePulse .12s linear infinite;
}
@keyframes flamePulse{
  0%,100%{transform:scaleY(1) scaleX(1)}
  50%{transform:scaleY(1.25) scaleX(.9)}
}
.rocket-glow{
  position:absolute;left:50%;bottom:0;
  width:160px;height:160px;
  transform:translateX(-50%) translateY(50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,180,80,.55), rgba(255,120,40,.2) 40%, transparent 70%);
  opacity:0;
  filter:blur(12px);
  will-change:opacity;
}
.rocket.launch .rocket-glow{animation:glowPulse 1.15s ease-out forwards}
@keyframes glowPulse{
  0%{opacity:0}
  15%{opacity:1}
  70%{opacity:.8}
  100%{opacity:0}
}

/* ============================================================
   INTRO
   ============================================================ */
.intro-screen{
  position:fixed;inset:0;z-index:70;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  background:radial-gradient(circle at 50% 50%, rgba(4,5,10,.4), rgba(4,5,10,.9));
  transition:opacity .5s var(--ease),visibility .5s;
}
.intro-screen.show{opacity:1;visibility:visible}
.intro-screen.hidden{opacity:0;visibility:hidden}

.intro-text{
  font-family:"Chewy",cursive;
  font-size:clamp(2.6rem,9vw,5.5rem);
  line-height:1;
  letter-spacing:.005em;
  font-weight:400;
  display:inline-flex;
  flex-wrap:wrap;
  justify-content:center;
  perspective:800px;
  user-select:none;
  filter:drop-shadow(0 0 30px rgba(200,215,255,.5));
}
.intro-text .i-letter{
  display:inline-block;
  background:linear-gradient(180deg,#ffffff 0%,#dfe5f5 40%,#a9b3cc 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  opacity:0;
  transform:translateY(50px) scale(.2) rotateY(-180deg);
  filter:blur(12px);
  will-change:transform,opacity,filter;
  animation:introLetter .75s var(--ease-out) forwards;
  animation-delay:calc(var(--i) * 0.065s);
}
.intro-text .i-letter.space{width:.32em}
@keyframes introLetter{
  0%{opacity:0;transform:translateY(50px) scale(.2) rotateY(-180deg);filter:blur(12px)}
  55%{opacity:1;filter:blur(2px)}
  75%{transform:translateY(-6px) scale(1.08) rotateY(0deg);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateY(0deg);filter:blur(0)}
}
.intro-screen.pulse .intro-text{
  animation:glowPulse 0.5s ease-out;
}
@keyframes glowPulse{
  0%{filter:drop-shadow(0 0 30px rgba(200,215,255,.5))}
  45%{filter:drop-shadow(0 0 90px rgba(220,230,255,1)) drop-shadow(0 0 40px rgba(180,200,255,.7))}
  100%{filter:drop-shadow(0 0 30px rgba(200,215,255,.5))}
}
.intro-screen.fade-out{
  opacity:0;
  transform:scale(1.05);
  transition:opacity .55s var(--ease),transform .55s var(--ease),visibility .55s;
}

/* ============================================================
   APLIKASI UTAMA
   ============================================================ */
.pbar{position:fixed;top:0;left:0;height:2px;width:40%;z-index:40;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(220,230,255,.85),transparent);
  transform:translate3d(-100%,0,0);transition:opacity .25s var(--ease);will-change:transform}
.pbar.on{opacity:1;animation:load 1.2s linear infinite}
@keyframes load{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(260%,0,0)}}

.app{
  position:relative;z-index:1;
  opacity:0;
  pointer-events:none;
  transition:opacity .6s var(--ease);
}
.app.visible{opacity:1;pointer-events:auto}

.wrap{
  position:relative;
  max-width:780px;margin:0 auto;
  padding:clamp(28px,5vw,56px) clamp(16px,3.5vw,32px) 96px;
}

.head{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  margin:0 0 clamp(30px,5vw,52px);
  padding:8px 92px;
  min-height:80px;
}
.head-actions{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  display:flex;gap:8px;align-items:center;z-index:5;
}

.title{
  font-family:"Chewy",cursive;
  font-size:clamp(2.3rem,7vw,4rem);
  line-height:1.05;letter-spacing:.005em;font-weight:400;
  text-align:center;margin:0;
  display:inline-flex;flex-wrap:wrap;justify-content:center;gap:0;
  perspective:600px;user-select:none;
}
.title .letter{
  display:inline-block;
  background:linear-gradient(180deg,#ffffff 0%,#dfe5f5 38%,#a9b3cc 72%,#7b849e 100%);
  background-size:100% 200%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:letterBob 2.6s var(--ease) infinite,letterShine 5s ease-in-out infinite;
  animation-delay:calc(var(--i) * 0.09s),calc(var(--i) * 0.09s);
  will-change:transform,filter;
  transform-origin:50% 80%;
  filter:drop-shadow(0 0 12px rgba(200,215,255,.30));
  transition:transform .3s var(--ease),filter .3s var(--ease);
}
.title .letter.space{width:.35em}
.title:hover .letter{filter:drop-shadow(0 0 22px rgba(200,215,255,.7))}
.title .letter:hover{
  transform:translateY(-10px) scale(1.12) rotate(-3deg);
  animation-play-state:paused;
  filter:drop-shadow(0 0 26px rgba(220,230,255,.9));
}
@keyframes letterBob{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-9px) rotate(-1.5deg)}
}
@keyframes letterShine{
  0%,100%{background-position:0% 0%;filter:drop-shadow(0 0 10px rgba(200,215,255,.28))}
  50%{background-position:0% 100%;filter:drop-shadow(0 0 18px rgba(200,215,255,.55))}
}

.hbtn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(180,195,230,.06);
  border:1px solid var(--line);
  color:var(--ink-soft);font:inherit;font-weight:600;font-size:.9rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .2s var(--ease);
  position:relative;
}
.hbtn:hover{background:rgba(180,195,230,.12);border-color:var(--line-soft);color:var(--ink);transform:scale(1.06)}
.hbtn:active{transform:scale(.95)}
.hbtn svg{width:19px;height:19px}
.hbtn .lang-code{font-family:"Space Grotesk",sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}

.lang-menu{
  position:absolute;top:calc(100% + 10px);right:0;
  min-width:190px;
  background:linear-gradient(180deg,rgba(14,17,26,.98),rgba(8,10,16,.98));
  border:1px solid var(--line-soft);border-radius:14px;padding:6px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(180,195,230,.05);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transform:translate3d(0,-6px,0) scale(.97);
  transform-origin:top right;
  transition:opacity .22s var(--ease),transform .22s var(--ease-out);
  z-index:20;
}
.lang-menu.open{opacity:1;pointer-events:auto;transform:none}
.lang-menu button{
  display:flex;width:100%;align-items:center;gap:12px;
  padding:10px 12px;border:0;background:transparent;color:var(--ink-soft);
  font:inherit;font-size:.88rem;font-weight:500;border-radius:9px;
  cursor:pointer;text-align:left;
  transition:background .15s var(--ease),color .15s var(--ease);
}
.lang-menu button:hover{background:rgba(200,215,255,.08);color:var(--ink)}
.lang-menu button.on{background:rgba(200,215,255,.10);color:var(--ink)}
.lang-menu button .flag{font-family:"Space Grotesk",sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--mute);min-width:24px;text-transform:uppercase}
.lang-menu button.on .flag{color:var(--ink-soft)}
.lang-menu button .check{margin-left:auto;color:var(--ink);opacity:0;transition:opacity .15s ease}
.lang-menu button.on .check{opacity:1}
.lang-menu button .check svg{width:14px;height:14px;display:block}

.drop{
  display:block;border:1.5px dashed var(--line-soft);border-radius:20px;
  padding:clamp(28px,5vw,48px) 20px;text-align:center;cursor:pointer;
  background:var(--surface);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  position:relative;
  transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease);
  will-change:transform;
}
.drop:hover,.drop.over{
  border-color:rgba(220,230,255,.55);
  background:rgba(24,28,40,.8);
  transform:translate3d(0,-2px,0);
}
.drop.over{border-color:rgba(255,255,255,.9)}
.drop:focus-within{outline:2px solid rgba(220,230,255,.45);outline-offset:4px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{display:block;font-size:1.05rem;letter-spacing:-.01em;margin-bottom:6px;font-weight:600;color:var(--ink)}
.drop span{font-size:.85rem;color:var(--mute)}

.picker{margin-top:20px;display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.picker.show{grid-template-rows:1fr;margin-top:20px}
.picker-shell{overflow:hidden;min-height:0}
.picker-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 22px;background:var(--surface);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:14px;cursor:pointer;
  font:inherit;color:var(--ink);text-align:left;
  transition:border-color .2s var(--ease),background .2s var(--ease);
}
.picker-btn:hover{border-color:var(--line-soft)}
.picker.open .picker-btn{border-color:rgba(200,215,255,.4);background:rgba(20,24,36,.85)}
.picker-txt small{display:block;font-size:.68rem;color:var(--mute);font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.picker-txt b{display:block;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.chev{transition:transform .3s var(--ease);color:var(--mute);flex:none;will-change:transform}
.picker.open .chev{transform:rotate(180deg);color:var(--ink)}
.picker-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease),opacity .25s var(--ease);opacity:0}
.picker.open .picker-panel{grid-template-rows:1fr;opacity:1}
.picker-inner{overflow:hidden;min-height:0}
.picker.open .picker-inner{padding:18px 22px 22px}
.pgroup{margin-bottom:20px}
.pgroup:last-child{margin-bottom:0}
.pgroup>span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:700;margin-bottom:8px}
.pitems{display:flex;flex-wrap:wrap;gap:4px;margin:0 -8px}
.pchip{
  padding:8px 14px;background:transparent;border:none;border-radius:9px;
  cursor:pointer;font:inherit;font-weight:600;font-size:.86rem;color:var(--ink-soft);
  letter-spacing:.005em;transition:color .18s var(--ease),background .18s var(--ease);
}
.pchip:hover{color:var(--ink);background:rgba(200,215,255,.08)}
.pchip.on{color:var(--acc-ink);background:linear-gradient(180deg,#f2f4fb,#d5dbeb);box-shadow:0 6px 22px -10px rgba(200,215,255,.5)}

.bar{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.bar.show{grid-template-rows:1fr;margin-top:22px}
.bar-inner{overflow:hidden;min-height:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar.show .bar-inner{padding:2px 0}
.btn{
  border:0;border-radius:11px;padding:11px 20px;min-height:44px;
  font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;
  background:linear-gradient(180deg,#f2f4fb,#d5dbeb);color:var(--acc-ink);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s ease;
}
.btn:hover:not(:disabled){transform:translate3d(0,-1px,0);box-shadow:0 12px 28px -12px rgba(200,215,255,.55)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover:not(:disabled){border-color:var(--line-soft);background:rgba(200,215,255,.05);box-shadow:none}
.btn.link{background:none;color:var(--mute);padding:11px 6px;text-decoration:none;font-weight:500;position:relative}
.btn.link::after{content:"";position:absolute;left:6px;right:6px;bottom:8px;height:1px;background:currentColor;opacity:.4;transition:opacity .2s ease}
.btn.link:hover{color:var(--ink)}
.btn.link:hover::after{opacity:1}
:focus-visible{outline:2px solid rgba(220,230,255,.55);outline-offset:2px}

ul{list-style:none;margin:26px 0 0;padding:0}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;
  gap:14px 20px;align-items:center;padding:18px 4px;
  border-bottom:1px solid var(--line);line-height:1.5;
}
.row:first-child{border-top:1px solid var(--line)}
.row.in{animation:rowIn .4s var(--ease-out) both}
@keyframes rowIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.nm{min-width:0}
.nm b{display:block;font-weight:600;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);letter-spacing:-.005em;margin-bottom:2px}
.nm small{color:var(--mute);font-size:.78rem;letter-spacing:.005em;display:block}
.fm{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--ink-soft)}
.ext{font-weight:700;font-size:.7rem;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.fm svg{width:13px;height:13px;flex:none;color:var(--mute);opacity:.7}
.fm .to{font-weight:700;font-size:.82rem;color:var(--ink);letter-spacing:.005em}
.st{min-width:110px;text-align:right;font-size:.82rem;color:var(--ink)}
.st .ok{color:var(--ok);font-weight:600;letter-spacing:.005em}
.st .er{color:var(--err);letter-spacing:.005em}
.st small{color:var(--mute);display:block;font-size:.74rem;margin-top:1px}
.dl{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 14px;min-height:34px;font:inherit;font-weight:600;font-size:.8rem;cursor:pointer;color:var(--ink);transition:border-color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease)}
.dl:hover{border-color:var(--line-soft);background:rgba(200,215,255,.06);transform:translate3d(0,-1px,0)}
.x{border:0;background:none;font-size:1.25rem;line-height:1;color:var(--mute);cursor:pointer;min-height:34px;border-radius:8px;transition:color .18s ease,transform .25s var(--ease)}
.x:hover{color:var(--err);transform:rotate(90deg)}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid var(--line-soft);border-top-color:var(--ink);border-radius:50%;vertical-align:-1px;margin-right:7px;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:48px 0;color:var(--mute);font-size:.9rem;text-align:center;letter-spacing:.005em}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate3d(-50%,16px,0);
  background:rgba(24,28,40,.95);color:var(--ink);
  padding:12px 22px;border-radius:12px;border:1px solid var(--line-soft);
  opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
  max-width:calc(100% - 32px);z-index:80;font-size:.86rem;
  box-shadow:0 20px 48px -24px rgba(0,0,0,.8);
  font-weight:500;letter-spacing:.005em;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.toast.on{opacity:1;transform:translate3d(-50%,0,0)}
.nm .er{display:block;color:var(--err);font-size:.74rem;margin-top:3px;letter-spacing:.005em;line-height:1.45}

.modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(2,3,8,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{
  position:relative;width:100%;max-width:620px;max-height:calc(100vh - 48px);
  background:linear-gradient(180deg,#0d1018,#070910);
  border:1px solid var(--line-soft);border-radius:22px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 0 1px rgba(180,195,230,.06);
  transform:translate3d(0,16px,0) scale(.98);
  transition:transform .3s var(--ease-out);
}
.modal.open .modal-card{transform:none}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 26px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0 0 4px;font-size:1.15rem;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.modal-head p{margin:0;font-size:.82rem;color:var(--mute);letter-spacing:.005em}
.modal-close{
  flex:none;width:36px;height:36px;border-radius:50%;
  background:rgba(180,195,230,.06);border:1px solid var(--line);
  color:var(--ink-soft);cursor:pointer;font:inherit;font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
}
.modal-close:hover{background:rgba(180,195,230,.12);border-color:var(--line-soft);color:var(--ink)}
.modal-body{padding:22px 26px 26px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(180,195,230,.2) transparent}
.modal-body::-webkit-scrollbar{width:8px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(180,195,230,.2);border-radius:4px}
.modal-body::-webkit-scrollbar-track{background:transparent}
.tut-section{margin-bottom:26px}
.tut-section:last-child{margin-bottom:0}
.tut-section h3{margin:0 0 12px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tut-steps{display:flex;flex-direction:column;gap:14px}
.tut-step{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:flex-start}
.tut-num{
  width:28px;height:28px;border-radius:8px;background:rgba(200,215,255,.08);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;color:var(--ink-soft);flex:none;
}
.tut-step-body h4{margin:0 0 3px;font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.tut-step-body p{margin:0;font-size:.83rem;color:var(--ink-soft);line-height:1.6;letter-spacing:.005em}
.tut-step-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;padding:1px 6px;border-radius:5px;background:rgba(180,195,230,.09);color:var(--ink);border:1px solid var(--line)}
.tut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tut-card{background:rgba(180,195,230,.04);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tut-card b{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:4px;letter-spacing:-.005em}
.tut-card span{font-size:.76rem;color:var(--mute);line-height:1.55;letter-spacing:.005em;display:block}
.tut-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:rgba(180,195,230,.04);border:1px solid var(--line);font-size:.82rem;color:var(--ink-soft);line-height:1.6}
.tut-note::before{content:"";flex:none;width:3px;align-self:stretch;background:linear-gradient(180deg,rgba(220,230,255,.7),rgba(220,230,255,.2));border-radius:2px}

@media(max-width:720px){
  .head{padding:8px 96px 8px 8px}
  .title{font-size:clamp(2rem,8vw,3rem)}
}
@media(max-width:600px){
  .row{grid-template-columns:minmax(0,1fr) 32px}
  .fm{grid-column:1/-1;order:3}
  .st{grid-column:1/-1;order:4;text-align:left;min-width:0}
  .modal{padding:12px}
  .modal-head{padding:20px 20px 16px}
  .modal-body{padding:18px 20px 22px}
  .head{padding:6px 92px 6px 6px}
  .title{font-size:clamp(1.9rem,9vw,2.6rem)}
  .hbtn{width:38px;height:38px}
  .hbtn svg{width:17px;height:17px}
  .head-actions{gap:6px}
  .login-card{padding:28px 24px 24px}
  .login-title{font-size:1.4rem}
  .rocket{width:64px;height:112px}
}
@media(max-width:420px){
  .head{padding:6px 88px 6px 6px}
  .title{font-size:clamp(1.7rem,10vw,2.2rem)}
  .wrap{padding:20px 14px 72px}
  .login-screen{padding:16px}
  .login-card{padding:24px 20px 22px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .title .letter{animation:none;filter:drop-shadow(0 0 12px rgba(200,215,255,.30))}
  .intro-text .i-letter{animation:none;opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>

<canvas id="galaxy" aria-hidden="true"></canvas>
<div class="glow-layer" aria-hidden="true"></div>
<div class="pbar" id="pbar" aria-hidden="true"></div>

<!-- ============ LOGIN ============ -->

  <div class="login-card" id="loginCard">
    <div class="login-brand">Paanz Formatz</div>
    <h2 class="login-title">Welcome back</h2>
    <p class="login-hint">Masukkan kata sandi untuk melanjutkan</p>

    <div class="pw-field">
      <input type="password" id="pwInput" placeholder="Kata sandi" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="pw-toggle" id="pwToggle" type="button" aria-label="Tampilkan kata sandi">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>

<!-- ============ ROKET ============ -->

    <div class="rocket-glow"></div>
    <svg viewBox="0 0 80 140" width="100%" height="100%" aria-hidden="true">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3a4560"/>
          <stop offset="45%" stop-color="#d0daf2"/>
          <stop offset="55%" stop-color="#c8d3ed"/>
          <stop offset="100%" stop-color="#4a5470"/>
        </linearGradient>
        <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe8a0"/>
          <stop offset="25%" stop-color="#ffb347"/>
          <stop offset="60%" stop-color="#ff7a1f"/>
          <stop offset="100%" stop-color="#c63a1a" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="windowGrad" cx="35%" cy="32%">
          <stop offset="0%" stop-color="#b8caf5"/>
          <stop offset="60%" stop-color="#3a4a72"/>
          <stop offset="100%" stop-color="#161f38"/>
        </radialGradient>
        <linearGradient id="finGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a4460"/>

        </linearGradient>
      </defs>
      <path d="M20 82 L4 118 L20 110 Z" fill="url(#finGrad)"/>
      <path d="M60 82 L76 118 L60 110 Z" fill="url(#finGrad)"/>
      <path d="M40 6 C24 28, 20 50, 20 80 L20 110 L60 110 L60 80 C60 50, 56 28, 40 6 Z" fill="url(#bodyGrad)"/>
      <path d="M20 82 L60 82" stroke="#1a2542" stroke-width=".8" opacity=".6"/>
      <path d="M20 96 L60 96" stroke="#1a2542" stroke-width=".8" opacity=".4"/>
      <circle cx="40" cy="48" r="10" fill="url(#windowGrad)" stroke="#8896b8" stroke-width="1.2"/>
      <ellipse cx="37" cy="44" rx="3" ry="2" fill="rgba(255,255,255,.55)"/>

  </div>
</div>

<!-- ============ INTRO ============ -->

<!-- ============ APLIKASI ============ -->
<div class="app" id="app">
  <div class="wrap">
    <div class="head">
      <h1 class="title" id="title" aria-label="Paanz Formatz"></h1>

        <button class="hbtn" id="langBtn" type="button" aria-label="Language" aria-haspopup="true" aria-expanded="false">

    <label class="drop" id="drop">

<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   GALAXY STARFIELD
   ============================================================ */
(function galaxy(){
  const canvas=document.getElementById('galaxy');
  const ctx=canvas.getContext('2d',{alpha:true});
  let W=0,H=0,DPR=1,stars=[],shooting=[],lastShoot=0,raf=null,paused=false;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildStars();
  }
  function buildStars(){
    const count=Math.min(360,Math.max(120,Math.round((W*H)/4200)));
    stars=[];
    for(let i=0;i<count;i++) stars.push(makeStar());
  }
  function makeStar(){
    const r=Math.random();
    let size;
    if(r<0.75) size=0.4+Math.random()*0.4;
    else if(r<0.95) size=0.9+Math.random()*0.5;
    else size=1.5+Math.random()*0.8;
    const tint=Math.random();
    let hue;
    if(tint<0.7) hue=220; else if(tint<0.88) hue=260; else hue=200;
    return {
      x:Math.random()*W, y:Math.random()*H, size,
      base:0.25+Math.random()*0.65,
      twinkleSpeed:0.4+Math.random()*1.2,
      twinklePhase:Math.random()*Math.PI*2,
      driftX:(Math.random()-0.5)*0.028,
      driftY:-0.008-Math.random()*0.028,
      hue, glow:size>1.1
    };
  }
  function spawnShooting(){
    const startX=Math.random()*W*0.6;
    const startY=Math.random()*H*0.4;
    const angle=Math.PI/6+Math.random()*Math.PI/6;
    shooting.push({
      x:startX,y:startY,
      dx:Math.cos(angle),dy:Math.sin(angle),
      len:80+Math.random()*120,life:1,
      speed:4+Math.random()*3
    });
  }
  let t=0;
  function draw(){
    if(paused){raf=null;return}
    t+=0.016;
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.x+=s.driftX; s.y+=s.driftY;
      if(s.y<-4){s.y=H+4;s.x=Math.random()*W}
      if(s.x<-4)s.x=W+4; if(s.x>W+4)s.x=-4;
      const k=0.65+0.35*Math.sin(t*s.twinkleSpeed+s.twinklePhase);
      const alpha=s.base*k;
      if(s.glow){
        const grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.size*5);
        grad.addColorStop(0,`hsla(${s.hue},90%,90%,${alpha*0.85})`);
        grad.addColorStop(0.4,`hsla(${s.hue},80%,75%,${alpha*0.25})`);
        grad.addColorStop(1,`hsla(${s.hue},80%,70%,0)`);
        ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(s.x,s.y,s.size*5,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle=`hsla(${s.hue},55%,96%,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    }
    if(!reduced && t-lastShoot>8+Math.random()*10){
      lastShoot=t;
      if(Math.random()<0.55) spawnShooting();
    }
    for(let i=shooting.length-1;i>=0;i--){
      const sh=shooting[i];
      sh.x+=sh.dx*sh.speed; sh.y+=sh.dy*sh.speed; sh.life-=0.008;
      if(sh.life<=0||sh.x>W+80||sh.y>H+80){shooting.splice(i,1);continue}
      const tailX=sh.x-sh.dx*sh.len, tailY=sh.y-sh.dy*sh.len;
      const grad=ctx.createLinearGradient(tailX,tailY,sh.x,sh.y);
      grad.addColorStop(0,'rgba(220,230,255,0)');
      grad.addColorStop(0.7,`rgba(220,230,255,${0.35*sh.life})`);
      grad.addColorStop(1,`rgba(255,255,255,${0.85*sh.life})`);
      ctx.strokeStyle=grad; ctx.lineWidth=1.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(sh.x,sh.y); ctx.stroke();
      const g2=ctx.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,6);
      g2.addColorStop(0,`rgba(255,255,255,${0.9*sh.life})`);
      g2.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(sh.x,sh.y,6,0,Math.PI*2); ctx.fill();
    }
    raf=requestAnimationFrame(draw);
  }
  function start(){
    if(reduced){drawStatic();return}
    if(raf)return;
    raf=requestAnimationFrame(draw);
  }
  function drawStatic(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      ctx.fillStyle=`hsla(${s.hue},55%,96%,${s.base})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    }
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){paused=true}
    else{paused=false;if(!raf)raf=requestAnimationFrame(draw)}
  });
  let rt;
  window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,150)});
  resize(); start();
})();

/* ============================================================
   BUILD LETTER TITLE (untuk animasi gelombang)
   ============================================================ */
function buildLetterTitle(el,text){
  el.innerHTML='';
  let i=0;
  for(const ch of text){
    const span=document.createElement('span');
    if(ch===' '){
      span.className='letter space';
      span.innerHTML='&nbsp;';
    }else{
      span.className='letter';
      span.textContent=ch;
    }

  const base=0x78;

async function submitLogin(){
  const val=pwInput.value;
  if(!val){

async function runLoginFlow(){

  /* 2. Roket meluncur */
  rocket.classList.add('launch');

  flashOverlay.classList.add('fire');

  await sleep(700);

  /* 3. Intro huruf-huruf fly in */
  introScreen.classList.add('show');
  await sleep(1300);
  introScreen.classList.add('pulse');
  await sleep(400);
  introScreen.classList.add('fade-out');

  app.classList.add('visible');

async function conv_image(f,to,o){
  const url=URL.createObjectURL(f.file);
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Gambar tidak bisa dibaca'));i.src=url});
  const w=Math.max(1,Math.round((im.naturalWidth||512)*o.scale)),h=Math.max(1,Math.round((im.naturalHeight||512)*o.scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(to==='jpg'||to==='pdf'){x.fillStyle=o.bg;x.fillRect(0,0,w,h)}
  x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
  if(to==='pdf'){
    const d=new jspdf.jsPDF({orientation:w>h?'l':'p',unit:'px',format:[w,h],hotfixes:['px_scaling']});
    d.addImage(c.toDataURL('image/jpeg',o.q),'JPEG',0,0,w,h);return d.output('blob');
  }

async function pdfLoad(f){

async function pdfRenderPage(doc,p,scale=2,bg='#ffffff'){
  const page=await doc.getPage(p);
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(vp.width));c.height=Math.max(1,Math.round(vp.height));
  const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;
  return c;
}
async function pdfExtractText(f){
  const doc=await pdfLoad(f);const pages=[];
  try{
    for(let p=1;p<=doc.numPages;p++){
      const tc=await(await doc.getPage(p)).getTextContent();
      let line='',lastY=null;const lines=[];
      for(const it of tc.items){
        const y=it.transform[5];
        if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(line);line=''}
        line+=it.str;lastY=y;
        if(it.hasEOL){lines.push(line);line='';lastY=null}
      }
      if(line.trim())lines.push(line);
      pages.push(lines.join('\n').replace(/[ \t]+\n/g,'\n').trim());
    }
  }finally{try{doc.destroy()}catch{}}
  return pages;
}
async function conv_pdf(f,to,o){
  if(to==='docx'){
    const doc=await pdfLoad(f);const blocks=[];
    try{
      for(let p=1;p<=doc.numPages;p++){
        if(p>1)blocks.push({type:'pagebreak'});
        const c=await pdfRenderPage(doc,p,2.2,'#ffffff');
        blocks.push({type:'image',data:c.toDataURL('image/jpeg',0.9),width:c.width,height:c.height});
      }
    }finally{try{doc.destroy()}catch{}}
    if(!blocks.length)throw new Error('PDF kosong');
    return makeDocx(blocks);
  }
  if(to==='txt'||to==='html'){
    const pages=await pdfExtractText(f);
    const text=pages.filter(Boolean).join('\n\n');
    if(!text)throw new Error('PDF tidak berisi teks (kemungkinan hasil scan)');
    if(to==='txt')return new Blob([text],{type:'text/plain'});
    return new Blob(['<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(f.file.name)+'</title><body style="font:16px/1.7 system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.7">'
      + text.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')],{type:'text/html'});
  }
  const doc=await pdfLoad(f);
  try{
    const render=async p=>{
      const c=await pdfRenderPage(doc,p,2*(o.scale||1),to==='jpg'?o.bg:'#ffffff');
      const b=await new Promise(ok=>c.toBlob(ok,MIME[to],o.q));
      if(!b)throw new Error('Browser ini tidak mendukung '+to.toUpperCase());
      return b;
    };
    const base=baseName(f.file.name);
    if(doc.numPages>1){
      const z=new JSZip();
      for(let p=1;p<=doc.numPages;p++)z.file(base+'-'+p+'.'+to,await render(p));
      const blob=await z.generateAsync({type:'blob'});
      f.out=base+'-halaman.zip';
      return blob;
    }
    return await render(1);
  }finally{try{doc.destroy()}catch{}}
}

  measure.innerHTML=r.value;styleBlocks(measure);
  document.body.appendChild(measure);await waitImages(measure);
  const blocks=Array.from(measure.children);const pages=[];let cur=[],curH=0;
  for(const block of blocks){
    const cs=getComputedStyle(block);
    const mt=parseFloat(cs.marginTop)||0;
    const mb=parseFloat(cs.marginBottom)||0;
    const h=block.getBoundingClientRect().height;
    const total=mt+h+mb;
    if(h>CONTENT_H){if(cur.length){pages.push(cur);cur=[];curH=0}pages.push([block]);continue}
    if(curH+total>CONTENT_H&&cur.length){pages.push(cur);cur=[block];curH=total}
    else{cur.push(block);curH+=total}
  }
  if(cur.length)pages.push(cur);
  document.body.removeChild(measure);
  if(!pages.length)throw new Error('Dokumen kosong');
  const pdf=new jspdf.jsPDF({unit:'pt',format:'a4'});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  const scale=2;
  for(let i=0;i<pages.length;i++){
    const pageDiv=document.createElement('div');
    pageDiv.style.cssText=['position:fixed','left:-99999px','top:0',`width:${A4_W}px`,`height:${A4_H}px`,`padding:${PAD_Y}px ${PAD_X}px`,'background:#ffffff','color:#000000','font-family:Georgia,"Times New Roman",serif','font-size:14px','line-height:1.7','word-wrap:break-word','overflow:hidden','box-sizing:border-box'].join(';');
    pages[i].forEach(b=>pageDiv.appendChild(b.cloneNode(true)));
    styleBlocks(pageDiv);document.body.appendChild(pageDiv);await waitImages(pageDiv);
    const canvas=await html2canvas(pageDiv,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,width:A4_W,height:A4_H,windowWidth:A4_W});
    document.body.removeChild(pageDiv);
    if(i>0)pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',0,0,pw,ph);
  }
  return pdf.output('blob');
}
async function conv_docx(f,to){
  if(typeof mammoth==='undefined')throw new Error('Pustaka DOCX gagal dimuat');
  const buf=await f.file.arrayBuffer();
  if(to==='txt'){const r=await mammoth.extractRawText({arrayBuffer:buf});return new Blob([r.value],{type:'text/plain'})}
  if(to==='rtf'){const r=await mammoth.extractRawText({arrayBuffer:buf});return new Blob([toRtf(r.value)],{type:'application/rtf'})}
  if(to==='html'){const r=await docxToHtml(buf);return new Blob(['<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(f.file.name)+'</title><body style="font:16px/1.7 system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.7">'+r.value],{type:'text/html'})}
  return docxToPdf(buf);
}
async function conv_sheet(f,to){
  let wb;
  if(f.ext==='json'){let d=JSON.parse(await f.file.text());if(!Array.isArray(d))d=[d];wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),'Sheet1')}
  else if(f.ext==='csv'||f.ext==='tsv'||f.ext==='xml'){wb=XLSX.read(await f.file.text(),{type:'string'})}
  else{wb=XLSX.read(await f.file.arrayBuffer(),{type:'array'})}
  const ws=wb.Sheets[wb.SheetNames[0]],U=XLSX.utils,T=(s,t)=>new Blob([s],{type:t});
  if(to==='csv')return T('\ufeff'+U.sheet_to_csv(ws),'text/csv');
  if(to==='tsv')return T(U.sheet_to_csv(ws,{FS:'\t'}),'text/tab-separated-values');
  if(to==='json')return T(JSON.stringify(U.sheet_to_json(ws),null,2),'application/json');
  if(to==='html')return T('<!doctype html><meta charset="utf-8">'+U.sheet_to_html(ws),'text/html');
  if(to==='txt')return T(U.sheet_to_txt(ws),'text/plain');
  const rows=U.sheet_to_json(ws,{header:1,defval:''}).map(r=>r.map(v=>v==null?'':String(v)));
  if(to==='xml'){const xml='<?xml version="1.0" encoding="UTF-8"?>\n<sheet>\n'+rows.map((r,i)=>'  <row index="'+(i+1)+'">\n'+r.map((c,j)=>'    <cell col="'+(j+1)+'">'+xmlEsc(c)+'</cell>').join('\n')+'\n  </row>').join('\n')+'\n</sheet>';return T(xml,'application/xml')}
  if(to==='docx')return makeDocx([{type:'table',rows:rows.length?rows:[['(kosong)']]}]);
  if(to==='pdf'){
    const d=new jspdf.jsPDF({unit:'pt',format:'a4'});
    if(rows.length&&typeof d.autoTable==='function'){d.autoTable({head:[rows[0]],body:rows.slice(1),startY:42,styles:{fontSize:9,cellPadding:4,overflow:'linebreak'},headStyles:{fillColor:[30,34,48],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[245,246,251]},margin:{left:40,right:40}})}
    else{const txt=rows.map(r=>r.join('  |  ')).join('\n');d.setFontSize(10);let y=52;for(const l of d.splitTextToSize(txt||'(kosong)',515)){if(y>790){d.addPage();y=52}d.text(l,40,y);y+=14}}
    return d.output('blob');
  }
  return new Blob([XLSX.write(wb,{bookType:to,type:'array'})]);
}
async function conv_text(f,to){
  const s=await f.file.text(),e=norm(f.ext),isH=e==='html';
  const plain=()=>isH?new DOMParser().parseFromString(s,'text/html').body.textContent.trim():s;
  if(to==='txt')return new Blob([plain()],{type:'text/plain'});
  if(to==='html'){if(isH)return new Blob([s],{type:'text/html'});return new Blob(['<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(f.file.name)+'</title><body style="font:16px/1.7 system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.7"><pre style="white-space:pre-wrap;font:inherit">'+esc(s)+'</pre>'],{type:'text/html'})}
  if(to==='json'){const text=plain();const lines=text.split('\n');return new Blob([JSON.stringify({text,lines,lineCount:lines.length,charCount:text.length},null,2)],{type:'application/json'})}
  if(to==='xml'){const lines=plain().split('\n');const xml='<?xml version="1.0" encoding="UTF-8"?>\n<document>\n'+lines.map((l,i)=>'  <line index="'+(i+1)+'">'+xmlEsc(l)+'</line>').join('\n')+'\n</document>';return new Blob([xml],{type:'application/xml'})}
  if(to==='csv'){const lines=plain().split('\n');const csv=lines.map(l=>'"'+l.replace(/"/g,'""')+'"').join('\n');return new Blob(['\ufeff'+csv],{type:'text/csv'})}
  if(to==='rtf')return new Blob([toRtf(plain())],{type:'application/rtf'});
  if(to==='docx'){const blocks=plain().split(/\n{2,}/).map(p=>({type:'p',text:p}));return makeDocx(blocks.length?blocks:[{type:'p',text:''}])}
  return textToPdf(plain());
}
async function conv_audio(f){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  let buf;try{buf=await ctx.decodeAudioData(await f.file.arrayBuffer())}catch{throw new Error('Audio tidak bisa dibaca')}finally{ctx.close()}
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate,v=new DataView(new ArrayBuffer(44+n*ch*2));
  const ws=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  const d=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let p=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}
  return new Blob([v],{type:'audio/wav'});
}
const CONV={
  image:(f,to,o)=>conv_image(f,to,o),
  pdf:(f,to,o)=>conv_pdf(f,to,o),
  doc:(f,to)=>conv_docx(f,to),
  sheet:(f,to)=>conv_sheet(f,to),
  text:(f,to)=>conv_text(f,to),
  audio:(f)=>conv_audio(f)
};
async function run(){
  if(busy)return;busy=true;render();
  const o=opt();
  try{
    for(;;){
      const f=files.find(x=>x.status==='idle');if(!f)break;
      f.status='busy';render();
      await new Promise(r=>setTimeout(r,20));
      try{
        f.out=null;
        f.blob=await CONV[f.cat](f,f.to,o);
        f.out=f.out||baseName(f.file.name)+'.'+f.to;
        f.status='done';
      }catch(e){f.status='err';f.err=e.message||'Gagal mengubah file'}
      render();
    }
  }finally{busy=false;render()}
}
function save(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
